server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  application:
    name: unimark-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/unimark}
    username: ${SPRING_DATASOURCE_USERNAME:unimark}
    password: ${SPRING_DATASOURCE_PASSWORD:unimark-local-password}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

unimark:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    host: ${UNIMARK_SMTP_HOST:}
    port: ${UNIMARK_SMTP_PORT:587}
    username: ${UNIMARK_SMTP_USERNAME:}
    password: ${UNIMARK_SMTP_PASSWORD:}
    from: ${UNIMARK_SMTP_FROM:}
    security: ${UNIMARK_SMTP_SECURITY:starttls}
  security:
    jwt-secret: ${UNIMARK_JWT_SECRET:}
    issuer: unimark-api
    access-token-minutes: 15
    refresh-token-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
